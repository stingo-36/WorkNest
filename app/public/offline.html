<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2b2a">
<title>Offline · WorkNest</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
  /* Shown by the service worker when a page can't load. Standalone file, so the
     app palette is repeated here: tint #f3f6f5, ink #0f2b2a, muted #4a5d5a. */
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    background: #f3f6f5;
    color: #102826;
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 26rem; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
  img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { margin: 8px 0 0; font-size: clamp(2rem, 6vw, 2.75rem); line-height: 1.05; font-weight: 800; letter-spacing: -0.04em; }
  p { margin: 0; font-size: 1.0625rem; color: #4a5d5a; }
  button {
    margin-top: 8px; height: 48px; padding: 0 24px; border: 0; border-radius: 999px;
    background: #0f2b2a; color: #fff; font: inherit; font-size: 1.0625rem; font-weight: 600; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #13706a; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>WorkNest keeps your logs on the server, so it needs a connection. Nothing you saved is lost — try again once you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
